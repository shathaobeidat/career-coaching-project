<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="auth">

    <!-- Left panel -->
    <aside class="auth__aside">
      <a class="brand" href="/">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M3 24h7v-7h7v-7h8" fill="none" stroke="#f0a62b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Waypoint
      </a>

      <div class="aside__hero">
        <h2 class="aside__headline">Pick up where you left off.</h2>
        <p class="aside__text">Your goals, session notes and next steps are waiting for you.</p>

        <svg class="path" viewBox="0 0 460 270" role="img" aria-label="A rising path with four milestones: now, 6 months, 12 months and 18 months.">
          <path class="path__ghost" d="M20 220H120V150H220V80H320V30H440"/>
          <path class="path__line" pathLength="1" d="M20 220H120V150H220V80H320V30H440"/>

          <g class="path__node" style="--d:.3s">
            <circle cx="20" cy="220" r="8"/>
            <text class="path__when" x="32" y="246">Now</text>
            <text class="path__what" x="32" y="262">Data analyst</text>
          </g>
          <g class="path__node" style="--d:.8s">
            <circle cx="120" cy="150" r="8"/>
            <text class="path__when" x="132" y="176">6 months</text>
            <text class="path__what" x="132" y="192">Senior analyst</text>
          </g>
          <g class="path__node" style="--d:1.3s">
            <circle cx="220" cy="80" r="8"/>
            <text class="path__when" x="232" y="106">12 months</text>
            <text class="path__what" x="232" y="122">Analytics lead</text>
          </g>
          <g class="path__node" style="--d:1.8s">
            <circle cx="320" cy="30" r="8"/>
            <text class="path__when" x="332" y="56">18 months</text>
            <text class="path__what" x="332" y="72">Head of insights</text>
          </g>
        </svg>
      </div>
    </aside>

    <!-- Form -->
    <main class="auth__main">
      <div class="auth__card">
        <h1 class="form__title">Log in</h1>
        <p class="form__lead">Welcome back. Continue with your coaching plan.</p>

        <div class="social">
          <button type="button" class="btn btn--outline">Continue with Google</button>
          <button type="button" class="btn btn--outline">Continue with LinkedIn</button>
        </div>

        <div class="divider" role="separator"><span>or use your email</span></div>

        <form action="/login" method="post" data-validate novalidate>
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="field__input" id="email" name="email" type="email"
                   autocomplete="email" placeholder="name@example.com"
                   data-rule="email" aria-describedby="email-error" required>
            <p class="field__error" id="email-error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label class="field__label" for="password">Password</label>
            <div class="password">
              <input class="field__input" id="password" name="password" type="password"
                     autocomplete="current-password"
                     data-rule="password-login" aria-describedby="password-error" required>
              <button type="button" class="password__toggle" data-toggle-password
                      aria-controls="password" aria-pressed="false" aria-label="Show password">Show</button>
            </div>
            <p class="field__error" id="password-error" aria-live="polite"></p>
          </div>

          <div class="login__row">
            <label class="check">
              <input type="checkbox" name="remember">
              <span>Keep me logged in</span>
            </label>
            <a class="login__forgot" href="/forgot-password">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn--primary">Log in</button>
        </form>

        <p class="form__switch">New to Waypoint? <a href="signup.html">Create an account</a></p>
      </div>
    </main>

  </div>

  <script src="auth.js"></script>
</body>
</html>
