<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password | CareerPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <main class="auth">
    <aside class="auth-side">
      <a class="brand" href="index.html"><span class="brand-mark"></span>CareerPath</a>
      <h1>Locked out? It happens.</h1><p>Enter your email and we will send you a link to choose a new password.</p><svg class="trail" viewBox="0 0 320 120" aria-hidden="true"><path d="M6 100 C 70 100, 70 30, 140 40 S 230 90, 314 14" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="6" cy="100" r="6" fill="currentColor"/><circle cx="140" cy="40" r="6" fill="currentColor"/><circle cx="314" cy="14" r="9" fill="#F2A93B"/></svg>
    </aside>
    <section class="auth-panel">
      <h2>Reset your password</h2>
      <p class="muted">Remembered it? <a href="login.html">Log in</a></p>
      <form action="login.html">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <button class="btn" type="submit">Send reset link</button>
      </form>
    </section>
  </main>
</body>
</html>
