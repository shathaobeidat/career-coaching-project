<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | CareerPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="dashboard.html"><span class="brand-mark"></span>CareerPath</a>
      <a class="nav-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="goals.html">My goals</a>
      <a class="nav-link" href="sessions.html">Sessions</a>
      <a class="nav-link" href="find-coach.html">Find a coach</a>
      <a class="nav-link active" href="profile.html">Profile</a>
      <a class="nav-link logout" href="login.html">Log out</a>
    </nav>
    <main class="content">
      <header class="page-head">
        <div><h1>Profile</h1><p class="muted">Update your details and password.</p></div>
        
      </header>
      <section class="panel form-panel">
        <div class="profile-head"><div class="avatar">SA</div><div><h2>Sara Ahmad</h2><p class="muted">Marketing coordinator</p></div></div>
        <form action="profile.html">
          <label for="fn">Full name</label><input id="fn" type="text" value="Sara Ahmad">
          <label for="em">Email</label><input id="em" type="email" value="sara@example.com">
          <label for="jt">Current job title</label><input id="jt" type="text" value="Marketing coordinator">
          <label for="np">New password</label><input id="np" type="password" autocomplete="new-password">
          <button class="btn" type="submit">Save changes</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
